name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_ENV: production

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Provide dummy values so the build does not fail when real secrets are absent.
          # Real values must be set as GitHub Actions secrets in the repo settings.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || 'placeholder' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || 'placeholder' }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN || 'placeholder' }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID || 'primary' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  indexnow:
    name: IndexNow ping
    runs-on: ubuntu-latest
    needs: build
    # PRs must never ping; only merges to main (Vercel deploys from main).
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Vercel builds and serves asynchronously after the push; the ping reads
      # the LIVE sitemap, so give the deploy time to land before submitting.
      - name: Wait for Vercel deploy
        run: sleep 90

      - name: Submit sitemap URLs to IndexNow
        run: node scripts/indexnow-ping.mjs
